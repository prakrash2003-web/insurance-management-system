{% extends 'insurance/_base.html' %}
{% block page_title %}{{ mode }} policy{% endblock %}
{% block content %}
<h1>{{ mode }} policy</h1>
<div class="card" style="max-width:620px">
  <form method="post" class="form">
    {% csrf_token %}
    {% include 'partials/_form.html' with form=policyForm %}
    <div class="btn-row">
      <button class="btn btn--primary" type="submit">Save</button>
      <a class="btn" href="{% url 'admin-view-policy' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
