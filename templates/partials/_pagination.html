{% load app_extras %}
{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}
    <a href="?{% qs_replace request page=page_obj.previous_page_number %}">&larr; Prev</a>
  {% else %}
    <span aria-disabled="true">&larr; Prev</span>
  {% endif %}

  <span class="current">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>

  {% if page_obj.has_next %}
    <a href="?{% qs_replace request page=page_obj.next_page_number %}">Next &rarr;</a>
  {% else %}
    <span aria-disabled="true">Next &rarr;</span>
  {% endif %}
</nav>
{% endif %}
