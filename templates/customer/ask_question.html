{% extends 'customer/_base.html' %}
{% block page_title %}Ask a question{% endblock %}
{% block content %}
<h1>Ask a question</h1>
<div class="card" style="max-width:600px">
  <form method="post" class="form">
    {% csrf_token %}
    {% include 'partials/_form.html' with form=questionForm %}
    <div class="btn-row">
      <button class="btn btn--primary" type="submit">Submit</button>
      <a class="btn" href="{% url 'question-history' %}">My questions</a>
    </div>
  </form>
</div>
{% endblock %}
