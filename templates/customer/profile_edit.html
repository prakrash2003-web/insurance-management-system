{% extends 'customer/_base.html' %}
{% block page_title %}Edit profile{% endblock %}
{% block content %}
<h1>Edit profile</h1>
<div class="card" style="max-width:600px">
  <form method="post" enctype="multipart/form-data" class="form">
    {% csrf_token %}
    <h3>Identity</h3>
    {% include 'partials/_form.html' with form=userForm %}
    <h3 style="margin-top:1rem">Contact</h3>
    {% include 'partials/_form.html' with form=customerForm %}
    <div class="btn-row">
      <button class="btn btn--primary" type="submit">Save changes</button>
      <a class="btn" href="{% url 'customer-profile' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
